# ============================================================================
# AgentX - packaging & tooling configuration
# ============================================================================

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentx"
version = "1.0.0"
description = "AgentX - a nine-module full-stack toolkit for high-tech freelance outsourcing: text classification, NLP phase detection, probability calibration, scheduling, path optimization, computational geometry, ETL/OCR, financial modeling and a REST API + frontend."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AgentX Project Contributors" }]
keywords = ["machine-learning", "nlp", "optimization", "scheduling", "etl", "finance", "fastapi", "freelance"]

dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
    "Pillow>=10.2.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10"]
cv = ["opencv-python-headless>=4.9.0"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.4"]

[project.scripts]
agentx-api = "agentx.api.main:run"

[tool.setuptools.packages.find]
include = ["agentx*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
