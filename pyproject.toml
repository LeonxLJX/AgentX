# ============================================================================
# AgentX - packaging & tooling configuration
# ============================================================================

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentx"
version = "1.0.0"
description = "AgentX - a nine-module full-stack toolkit for high-tech freelance outsourcing: text classification, NLP phase detection, probability calibration, scheduling, path optimization, computational geometry, ETL/OCR, financial modeling and a REST API + frontend."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AgentX Project Contributors" }]
keywords = ["machine-learning", "nlp", "optimization", "scheduling", "etl", "finance", "fastapi", "freelance"]

dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
    "Pillow>=10.2.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10"]
cv = ["opencv-python-headless>=4.9.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-Pillow",
    "types-python-multipart",
]

[project.scripts]
agentx-api = "agentx.api.main:run"

[tool.setuptools.packages.find]
include = ["agentx*"]

# ---------------------------------------------------------------------------
# pytest - run the full suite, show coverage, fail on warnings.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error::DeprecationWarning:sklearn.*",
    "ignore::DeprecationWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring optional dependencies (OCR / OpenCV)",
]

# ---------------------------------------------------------------------------
# ruff - lint + format in one tool. A single, opinionated config keeps the
# whole codebase uniform without per-file overrides.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["docs", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # function call in default argument (FastAPI pattern)
    "SIM117", # nested with-statements - sometimes clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"examples/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["agentx"]
force-single-line = false
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ---------------------------------------------------------------------------
# mypy - strict but pragmatic. Pydantic + FastAPI dynamics warrant a couple
# of targeted relaxations.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
strict_equality = true
exclude = ["build/", "dist/", "examples/"]

[[tool.mypy.overrides]]
module = [
    "cv2",
    "pytesseract",
    "matplotlib.*",
    "PIL.*",
    "PIL",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# coverage - demo-grade threshold; bump as the suite grows.
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["agentx"]
omit = ["*/tests/*", "*/examples/*", "*/tools/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = true
