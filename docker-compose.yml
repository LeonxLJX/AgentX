# ============================================================================
# AgentX - one-command stack:  docker compose up -d
# ============================================================================

services:
  agentx-api:
    build: .
    container_name: agentx-api
    ports:
      - "8000:8000"
    environment:
      - AGENTX_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
